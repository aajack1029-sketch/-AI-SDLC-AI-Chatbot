server.port=8080
spring.application.name=daily-report-rag-poc

# Gemini Developer API configuration (API key from Google AI Studio)
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.temperature=0.2

# Gemini Developer API embeddings; no Vertex AI project or location is used.
app.embedding.api-key=${GOOGLE_API_KEY}
app.embedding.model=gemini-embedding-001
# Qdrant 向量資料庫配置
# 可透過環境變數覆寫，方便在本機、Docker 或 Azure 內部部署環境中切換
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.collection-name=${QDRANT_COLLECTION:department_daily_reports_gemini_embedding_001}
spring.ai.vectorstore.qdrant.initialize-schema=${QDRANT_INIT_SCHEMA:true}
app.ingestion.enabled=${APP_INGESTION_ENABLED:true}
app.ingestion.limit=${APP_INGESTION_LIMIT:0}