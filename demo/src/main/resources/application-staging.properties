# Activated only with SPRING_PROFILES_ACTIVE=staging. Local defaults remain unchanged.
server.port=8080
spring.application.name=daily-report-rag-poc

# Firebase ID token verification and narrow browser origin.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
app.security.jwt.audience=${FIREBASE_PROJECT_ID}
app.security.jwt.jwk-set-uri=${FIREBASE_JWK_SET_URI:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}

# These credentials are supplied through the ACA secret store/environment.
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.temperature=0.2
app.embedding.api-key=${GOOGLE_API_KEY}
app.embedding.model=gemini-embedding-001

# Qdrant Cloud gRPC configuration. Supply endpoint host/port/key from the Qdrant account.
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT}
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY}
spring.ai.vectorstore.qdrant.use-tls=${QDRANT_USE_TLS:true}
spring.ai.vectorstore.qdrant.initialize-schema=${QDRANT_INIT_SCHEMA:false}
app.qdrant.knowledge-docs-collection=${QDRANT_KNOWLEDGE_DOCS_COLLECTION:chatbot-context-staging}
app.qdrant.daily-reports-collection=${QDRANT_DAILY_REPORTS_COLLECTION:daily-report-embeddings-staging}
app.qdrant.github-events-collection=${QDRANT_GITHUB_EVENTS_COLLECTION:github-sdlc-metadata-staging}

# Avoid automatic writes/ingestion into an external staging collection on each replica startup.
app.ingestion.enabled=${APP_INGESTION_ENABLED:false}
app.ingestion.limit=${APP_INGESTION_LIMIT:0}

# GitHub MCP stays off unless an operator explicitly enables it.
app.github.mcp.command=${GITHUB_MCP_COMMAND:npx}
app.github.mcp.package=${GITHUB_MCP_PACKAGE:@modelcontextprotocol/server-github}
app.github.token=${GITHUB_PERSONAL_ACCESS_TOKEN:}
app.github.repository.owner=${GITHUB_REPOSITORY_OWNER:}
app.github.repository.name=${GITHUB_REPOSITORY_NAME:}
app.github.sync.enabled=${GITHUB_SYNC_ENABLED:false}
app.github.sync.initial-delay-ms=${GITHUB_SYNC_INITIAL_DELAY_MS:15000}
app.github.sync.interval-ms=${GITHUB_SYNC_INTERVAL_MS:900000}
app.github.sync.page-size=${GITHUB_SYNC_PAGE_SIZE:100}
