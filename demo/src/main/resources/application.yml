app:
  github:
    token: ${GITHUB_TOKEN:${GITHUB_PERSONAL_ACCESS_TOKEN:}}
    repo: ${GITHUB_REPO:}
    repository:
      owner: ${GITHUB_REPOSITORY_OWNER:}
      name: ${GITHUB_REPOSITORY_NAME:}

spring:
  datasource:
    # 日報結構化資料 (SQL)。預設為本機 H2 檔案；測試或雲端可用環境變數覆寫。
    url: ${APP_DB_URL:jdbc:h2:file:./data/daily_reports;DB_CLOSE_ON_EXIT=FALSE}
    username: ${APP_DB_USER:sa}
    password: ${APP_DB_PASSWORD:}
  sql:
    init:
      mode: always
